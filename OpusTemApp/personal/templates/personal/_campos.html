{% for campo in form %}
<div class="field {% if campo.errors %}has-error{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if not campo.field.required %} (opcional){% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<p class="ayuda">{{ campo.help_text }}</p>{% endif %}
  {% for e in campo.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
{% endfor %}
